<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LOHEM">
  <meta name="description" content="LOHEM — מאמן אישי וירטואלי: תוכנית אימונים אדפטיבית, ריצה, תזונה ומעקב התקדמות.">
  <title>LOHEM · מאמן אישי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // ערכת נושא לפני הציור הראשון (בלי הבהוב)
    try {
      var st = JSON.parse(localStorage.getItem('golani_fit_v1') || '{}').settings || {};
      var t = st.themeV === 3 ? st.theme || 'auto' : 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f5f2ec' : '#13141c');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>האפליקציה דורשת JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
